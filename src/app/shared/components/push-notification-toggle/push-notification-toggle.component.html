@if (canEnable()) {
  <button
    type="button"
    class="push-toggle"
    (click)="toggle()"
    [disabled]="isBusy()"
    [pTooltip]="(isSubscribed() ? 'PUSH.DISABLE' : 'PUSH.ENABLE') | translate"
    tooltipPosition="top"
    [attr.aria-label]="(isSubscribed() ? 'PUSH.DISABLE' : 'PUSH.ENABLE') | translate"
    [attr.aria-pressed]="isSubscribed()"
  >
    <i
      class="pi"
      [class.pi-bell]="!isSubscribed()"
      [class.pi-bell-slash]="isSubscribed()"
      aria-hidden="true"
    ></i>
  </button>
}
